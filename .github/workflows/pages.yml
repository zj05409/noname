name: Publish playable Noname to Pages

on:
  push:
    branches: [codex/deepseek-ai]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: noname-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install audio encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - uses: actions/cache@v4
        with:
          path: .pages-audio-cache
          key: pages-audio-v1-${{ runner.os }}-${{ hashFiles('scripts/pages-audio.mjs', 'apps/core/audio/**') }}
      - run: pnpm install --frozen-lockfile
      - name: Test native AI, user-key requests, static files and replay
        run: pnpm test:deepseek
      - name: Build complete static game without credentials
        env:
          NONAME_BUILD_CHANNEL: test
          NONAME_BUILD_COMMIT: ${{ github.sha }}
          NONAME_PAGES_AUDIO_CONCURRENCY: 4
        run: pnpm build:pages
      - uses: actions/configure-pages@v5
      # upload-pages-artifact excludes dot directories, including our .pnpm modules.
      - name: Archive complete site including browser dependencies
        run: |
          tar --dereference --hard-dereference --directory dist-pages --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
          tar -tf "$RUNNER_TEMP/artifact.tar" > "$RUNNER_TEMP/pages-files.txt"
          grep -Fx './.nojekyll' "$RUNNER_TEMP/pages-files.txt"
          grep -q '^./node_modules/.pnpm/.*\.js$' "$RUNNER_TEMP/pages-files.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
